name: panorama
on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, closed, edited, ready_for_review, converted_to_draft]
  workflow_dispatch:
  workflow_call:
    inputs:
      catalog_ref:
        type: string
        required: false
        default: ""
permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    outputs:
      catalog_ref: ${{ steps.catalog.outputs.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: 解析已发布目录版本（不运行 PR 分支代码）
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_CATALOG: ${{ inputs.catalog_ref }}
        run: |
          if [ -n "$REQUESTED_CATALOG" ]; then
            catalog_ref="$REQUESTED_CATALOG"
          else
            catalog_ref="$(gh release view --json tagName --jq .tagName)"
          fi
          [[ "$catalog_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "$catalog_ref" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Published stable release required") else true end'
          printf 'ref=%s\n' "$catalog_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.catalog.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装固定版本 Yarn（安装向导双入口回归）
        run: npm install --global yarn@1.22.22
      - name: 发布目录校验
        run: |
          node mcp/ted-avc-manager/src/cli.js validate-layout
          node mcp/ted-avc-manager/src/cli.js validate-packs
          node mcp/ted-avc-manager/src/cli.js panorama-source-snapshot --check
          node scripts/check-knowledge.mjs
          node scripts/mcp-governance.mjs check-company
          node --test mcp/ted-avc-manager/src/core/*.test.mjs mcp/ted-avc-manager/src/governance/*.test.mjs mcp/ted-avc-manager/src/panorama/*.test.mjs scripts/*.test.mjs
          python3 -m unittest discover -s scripts -p '*_test.py'
      - name: 采集公开候选 PR（仅读元数据）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-pack-candidates.mjs --strict
      - name: 生成通用全景图（禁止读取个人数据）
        env:
          CATALOG_REF: ${{ steps.catalog.outputs.ref }}
        run: node mcp/ted-avc-manager/src/cli.js panorama --public --offline --catalog-ref "$CATALOG_REF"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: panorama
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: current
        name: 仅部署仍为最新的发布版本
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CATALOG_REF: ${{ needs.build.outputs.catalog_ref }}
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest" = "$CATALOG_REF" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer release supersedes this Pages artifact."
          fi
      - id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
