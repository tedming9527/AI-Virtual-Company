name: validate
on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验仓库布局、包与知识索引
        run: |
          node mcp/ted-avc-manager/src/cli.js validate-layout
          node mcp/ted-avc-manager/src/cli.js validate-packs
          node scripts/check-knowledge.mjs
          node scripts/mcp-governance.mjs check-company
      - name: 通用层回归
        run: node --test mcp/ted-avc-manager/src/core/*.test.mjs mcp/ted-avc-manager/src/panorama/*.test.mjs scripts/*.test.mjs
      - name: 校验现有日志 schema
        run: |
          for f in runtime/logs/*.json; do
            [ -e "$f" ] || continue
            node mcp/ted-avc-manager/src/cli.js validate-log "$f" || exit 1
          done
