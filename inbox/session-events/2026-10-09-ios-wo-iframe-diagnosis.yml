outcome: The parent has created an iframe with a valid WO code, but the available evidence does not prove that its child document did not navigate. The WO bootstrap depends on the child detecting the host-app user agent and then replacing its own route with orderNo/workOrderCode/businessScene.
evidence:
  - Screenshot DOM contains an iframe src with repairOrderCode=WO202610080005 and enter=zhyt.
  - Flexible passes only repairOrderCode and enter to the child; its layout gives the iframe full remaining page height.
  - Amumu recognizes WO via /^WO\\d+$/i, which matches the captured order code.
  - Amumu only enriches the route to businessScene=REPAIR_WO when platform.isInZhuYingTai is true; that flag is derived from the VKStaffAssistant user-agent token.
  - The authentication router guard runs before the page component and can also stop the page from mounting.
remaining: No child-frame Document request, redirect chain, console error, or child-frame user-agent/route values were captured. Root cause remains unconfirmed.
