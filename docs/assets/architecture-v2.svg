<svg viewBox="0 0 1200 1200" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block;background:#f7f8fa;">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>

<!-- 标题 -->
<text x="600" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827">AI-Virtual-Company · 技能包生命周期架构（v2 定稿）</text>
<text x="600" y="58" text-anchor="middle" font-size="13" fill="#6b7280">示意：基于多轮讨论收敛的架构逻辑，非官方结构</text>

<!-- Row1 用户 -->
<rect x="40" y="76" width="52" height="22" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="66" y="91" text-anchor="middle" font-size="11.5" fill="#374151">用户</text>
<rect x="330" y="72" width="540" height="56" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="600" y="104" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">用户输入：根据 github://owner/repo 开始执行初始化，安装 mcp</text>
<line x1="600" y1="130" x2="600" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

<!-- Row2 命令协议 -->
<rect x="40" y="152" width="76" height="22" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="78" y="167" text-anchor="middle" font-size="11.5" fill="#374151">命令协议</text>
<rect x="110" y="164" width="280" height="84" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
<text x="250" y="192" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#92400e">① URI 解析层</text>
<text x="130" y="218" font-size="12" fill="#374151">正则抽取 github://owner/repo</text>
<text x="130" y="240" font-size="12" fill="#6b7280">确定性代码，不靠模型猜</text>
<line x1="392" y1="206" x2="456" y2="206" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="460" y="164" width="280" height="84" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
<text x="600" y="192" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#92400e">② 意图映射层</text>
<text x="480" y="218" font-size="12" fill="#374151">动作词 → 流程ID</text>
<text x="480" y="240" font-size="12" fill="#6b7280">初始化/安装mcp → init_flow</text>
<line x1="742" y1="206" x2="806" y2="206" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="810" y="164" width="280" height="84" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
<text x="950" y="192" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#92400e">③ 流程执行层</text>
<text x="830" y="218" font-size="12" fill="#374151">预定义 skill 流程</text>
<text x="830" y="240" font-size="12" fill="#6b7280">LLM 按步执行并汇报</text>
<line x1="600" y1="250" x2="600" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

<!-- Row3 大模型 -->
<rect x="40" y="272" width="52" height="22" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="66" y="287" text-anchor="middle" font-size="11.5" fill="#374151">大模型</text>
<rect x="310" y="268" width="580" height="68" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="600" y="297" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">大模型执行端（豆包 / Codex）</text>
<text x="600" y="320" text-anchor="middle" font-size="13" fill="#047857">上下文注入 + 函数调用（内部直连）</text>
<line x1="600" y1="338" x2="600" y2="353" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text x="612" y="348" font-size="11.5" fill="#64748b">上下文注入 · 工具调用（函数调用直连）</text>

<!-- Row4 L0 本地运行时 -->
<rect x="110" y="356" width="920" height="268" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140" y="386" font-size="14" font-weight="bold" fill="#1d4ed8">L0 · 本地运行时（mac）—— Agent 中介层（自建直连）</text>
<text x="990" y="386" text-anchor="end" font-size="11.5" fill="#64748b">内部直连：无 MCP 协议层</text>

<rect x="150" y="402" width="280" height="132" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
<text x="290" y="430" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1d4ed8">初始化</text>
<text x="170" y="458" font-size="12" fill="#374151">· 读 bootstrap.json（极简）</text>
<text x="170" y="482" font-size="12" fill="#374151">· 扫描目录规约自动发现</text>
<text x="170" y="506" font-size="12" fill="#374151">· 自动安装预置 mcp/</text>

<rect x="460" y="402" width="280" height="132" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
<text x="600" y="430" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1d4ed8">分层注入（防上下文爆炸）</text>
<text x="480" y="458" font-size="12" fill="#374151">· 索引/规则：常驻轻量</text>
<text x="480" y="482" font-size="12" fill="#374151">· 知识包：按需 resource</text>
<text x="480" y="506" font-size="12" fill="#374151">· 工具：注册即用</text>

<rect x="770" y="402" width="280" height="132" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
<text x="910" y="430" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1d4ed8">本地演化</text>
<text x="790" y="458" font-size="12" fill="#374151">· 记忆 / 技能 / 等级提升</text>
<text x="790" y="482" font-size="12" fill="#374151">· 等级达标 → 申请晋升</text>
<text x="790" y="506" font-size="12" fill="#374151">· 失败归因 → 攒台账</text>

<rect x="140" y="548" width="880" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
<text x="160" y="568" font-size="12" font-weight="bold" fill="#92400e">.icloud（跨设备）</text>
<text x="160" y="586" font-size="11.5" fill="#78350f">技能 · 记忆 · 长期沉淀</text>
<text x="455" y="568" font-size="12" font-weight="bold" fill="#92400e">项目目录（项目级）</text>
<text x="455" y="586" font-size="11.5" fill="#78350f">项目信息 · 约定 · 决策</text>
<text x="750" y="568" font-size="12" font-weight="bold" fill="#92400e">系统 tmp（瞬时）</text>
<text x="750" y="586" font-size="11.5" fill="#78350f">会话草稿 · 缓存 · TTL</text>

<line x1="600" y1="626" x2="600" y2="641" stroke="#64748b" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="612" y="636" font-size="11.5" fill="#64748b">⇅ 下发：初始化/升级 · 回传：日志PR/晋升PR</text>

<!-- Row5 L1 中央仓库 -->
<rect x="110" y="644" width="920" height="240" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="140" y="674" font-size="14" font-weight="bold" fill="#166534">L1 · 中央仓库（GitHub）—— 初始化引导源 · 技能包注册表 · 版本账本 · 目录规约</text>

<rect x="130" y="686" width="205" height="132" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
<text x="232" y="714" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">引导清单</text>
<text x="150" y="742" font-size="12" fill="#374151">bootstrap.json（极简）</text>
<text x="150" y="766" font-size="12" fill="#6b7280">仅 name/version/通道</text>
<text x="150" y="790" font-size="12" fill="#6b7280">其余靠规约发现</text>

<rect x="355" y="686" width="205" height="132" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
<text x="457" y="714" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">目录规约</text>
<text x="375" y="742" font-size="12" fill="#374151">packs/skill · knowledge</text>
<text x="375" y="766" font-size="12" fill="#374151">framework · mcp/ · rules/</text>
<text x="375" y="790" font-size="12" fill="#6b7280">每包 SKILL.md + meta.json</text>

<rect x="580" y="686" width="205" height="132" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
<text x="682" y="714" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">多类型包注册表</text>
<text x="600" y="742" font-size="12" fill="#374151">skill · 专业知识</text>
<text x="600" y="766" font-size="12" fill="#374151">框架 · 规则</text>
<text x="600" y="790" font-size="12" fill="#6b7280">各自 rubric 维度</text>

<rect x="805" y="686" width="205" height="132" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
<text x="907" y="714" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">版本与治理</text>
<text x="825" y="742" font-size="12" fill="#374151">semver tag 账本</text>
<text x="825" y="766" font-size="12" fill="#374151">人审发布</text>
<text x="825" y="790" font-size="12" fill="#6b7280">= 最终信任锚</text>

<rect x="130" y="830" width="880" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/>
<text x="570" y="856" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">约定大于配置：目录即身份 · 入口即文档(SKILL.md) · 元数据即契约(meta.json) · 新增专业包即建目录 → 自动被发现</text>

<line x1="600" y1="886" x2="600" y2="907" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text x="612" y="898" font-size="11.5" fill="#64748b">目录规约 / 评分台账 → 生成器</text>

<!-- Row6 全景图生成管线 -->
<rect x="40" y="898" width="52" height="22" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="66" y="913" text-anchor="middle" font-size="11.5" fill="#374151">全景图</text>
<rect x="110" y="904" width="920" height="88" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
<text x="140" y="913" font-size="12" font-weight="bold" fill="#475569">全景图生成管线（一份生成器 · 两个触发端）</text>

<rect x="120" y="918" width="170" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="205" y="940" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">扫描目录规约</text>
<text x="205" y="958" text-anchor="middle" font-size="11.5" fill="#6b7280">按约定自动发现</text>
<line x1="292" y1="942" x2="306" y2="942" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="310" y="918" width="170" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="395" y="940" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">聚合元数据</text>
<text x="395" y="958" text-anchor="middle" font-size="11.5" fill="#6b7280">meta.json + 评分台账</text>
<line x1="482" y1="942" x2="496" y2="942" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="500" y="918" width="170" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="585" y="940" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">渲染 HTML</text>
<text x="585" y="958" text-anchor="middle" font-size="11.5" fill="#6b7280">包目录 · 版本 · 状态</text>
<line x1="672" y1="942" x2="686" y2="942" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="690" y="918" width="170" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="775" y="940" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">输出全景图</text>
<text x="775" y="958" text-anchor="middle" font-size="11.5" fill="#6b7280">panorama/ 统一落点</text>

<line x1="860" y1="934" x2="886" y2="934" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="890" y="914" width="230" height="34" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="1005" y="935" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d4ed8">GitHub Pages（CI 自动）</text>
<line x1="860" y1="968" x2="886" y2="968" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="890" y="954" width="230" height="34" rx="8" fill="#d1fae5" stroke="#10b981"/>
<text x="1005" y="975" text-anchor="middle" font-size="11.5" font-weight="600" fill="#047857">本地 MCP 手动触发生成</text>

<line x1="600" y1="994" x2="600" y2="1007" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text x="612" y="1002" font-size="11.5" fill="#64748b">状态展示 · 台账回流</text>

<!-- Row7 治理循环带 -->
<rect x="110" y="1010" width="920" height="144" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="140" y="1034" font-size="13" font-weight="bold" fill="#334155">治理循环带（中央 ⇄ 本地）</text>

<rect x="110" y="1044" width="220" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="110" y="1044" width="220" height="4" rx="2" fill="#3b82f6"/>
<text x="220" y="1072" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">① 版本循环（下发）</text>
<text x="130" y="1098" font-size="12" fill="#374151">中央 tag → check_update</text>
<text x="130" y="1120" font-size="12" fill="#374151">→ upgrade → 本地应用</text>

<rect x="350" y="1044" width="220" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="350" y="1044" width="220" height="4" rx="2" fill="#f59e0b"/>
<text x="460" y="1072" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">② 回传循环（信任分层）</text>
<text x="370" y="1098" font-size="12" fill="#374151">日志PR：免审+CI校验+</text>
<text x="370" y="1120" font-size="12" fill="#374151">保留窗口后删 · 晋升PR：人审</text>

<rect x="590" y="1044" width="220" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="590" y="1044" width="220" height="4" rx="2" fill="#10b981"/>
<text x="700" y="1072" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">③ 评分循环（治理）</text>
<text x="610" y="1098" font-size="12" fill="#374151">LLM静态分 + 实证分（挂版本）</text>
<text x="610" y="1120" font-size="12" fill="#374151">→ 台账 → 快车道/淘汰/排名</text>

<rect x="830" y="1044" width="220" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="830" y="1044" width="220" height="4" rx="2" fill="#0ea5e9"/>
<text x="940" y="1072" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">④ 改进循环</text>
<text x="850" y="1098" font-size="12" fill="#374151">周期人工触发 LLM 分析归因</text>
<text x="850" y="1120" font-size="12" fill="#374151">→ 优化 → 新版本 → 再下发</text>

<text x="600" y="1184" text-anchor="middle" font-size="12" fill="#6b7280">隐私底线：只上报聚合指标 · 不带原文 ｜ 人审发布 = 最终信任锚 ｜ 升级前验哈希/签名 ｜ 全景图 = 规约的自动生成活门户</text>
</svg>
