<text x="868" y="159" font-size="16" font-weight="700" fill="#9a3412" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">用户与人工复核 · 决策和信任门</text>
<text x="868" y="189" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">确定课题、授权范围与长期保存选择</text>
<text x="868" y="215" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">审查来源、脱敏、覆盖映射和候选差异</text>
<text x="868" y="241" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">批准个人资料清理及通用包 PR</text>
<text x="868" y="267" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">人审合并 master；CI 通过后发布</text>
<text x="868" y="293" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">岗位标签不等于具名员工实际参与</text>
<text x="40" y="374" font-size="19" font-weight="700" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">目录契约：文件身份由位置与元数据共同确定</text>
<rect x="40" y="393" width="390" height="310" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="58" y="424" font-size="16" font-weight="700" fill="#1d4ed8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">中央仓库 · 通用事实源</text>
<text x="58" y="454" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">packs/&lt;type&gt;/&lt;name&gt;/：四类包自动发现</text>
<text x="58" y="483" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">每包 meta.json + SKILL/PROFILE 等入口</text>
<text x="58" y="512" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">当前 27 包：skill 13 / knowledge 5</text>
<text x="58" y="541" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">framework 1 / role 8</text>
<text x="58" y="570" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">bootstrap.json 与 presets/ 定义有序下发</text>
<text x="58" y="599" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">rules/ 定跨包规则；模板由 templates/ 承载</text>
<text x="58" y="628" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">mcp/ 引擎；docs/、scripts/ 实现与说明</text>
<text x="58" y="657" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">panorama/ 容纳公开视图；PR 经人审发布</text>
<rect x="445" y="393" width="390" height="310" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="463" y="424" font-size="16" font-weight="700" fill="#15803d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">个人目录 · 私有课题与候选</text>
<text x="463" y="454" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">projects/&lt;slug&gt;/topics/&lt;topic-id&gt;/ 是主入口</text>
<text x="463" y="483" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">topic.json 关联会话和课题生命周期</text>
<text x="463" y="512" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">课题内按 memory / meetings / deliverables</text>
<text x="463" y="541" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">及 experience 等用途组织；长期资料可同步</text>
<text x="463" y="570" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">custom/ 自有资产；外部先入 staging/</text>
<text x="463" y="599" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">未提炼经验继续保留，复核后才处理</text>
<text x="463" y="628" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">archive/ 历史；discard/ 受清理门禁约束</text>
<text x="463" y="657" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">个人正文、路径和使用记录不进入 Git</text>
<rect x="850" y="393" width="390" height="310" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
