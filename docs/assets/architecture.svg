<text x="58" y="189" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">扫描目录并校验 meta、入口、版本和摘要</text>
<text x="58" y="215" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">绑定任务，观察宿主可见的 Pre/Post 事件</text>
<text x="58" y="241" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">按窗口去重统计；证据不足显示“未评分”</text>
<text x="58" y="267" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">生成本地/公开全景图并隔离私有字段</text>
<text x="58" y="293" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">不推断满意度，也不自动批准发布</text>
<rect x="445" y="128" width="390" height="206" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="463" y="159" font-size="16" font-weight="700" fill="#6d28d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">大模型 · 需要语义判断的工作</text>
<text x="463" y="189" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">按需读取资料，检索同课题及必要来源</text>
<text x="463" y="215" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">比较新旧知识、冲突、反例和适用边界</text>
<text x="463" y="241" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">合并提炼经验，提出候选和未覆盖清单</text>
<text x="463" y="267" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">建议升级、降级或审计；结论留待复核</text>
<text x="463" y="293" font-size="13" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">模型是否实际参与，以运行产物为证</text>
