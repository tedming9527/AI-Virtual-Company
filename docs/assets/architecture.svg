<text x="868" y="454" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">仓库 runtime/：应只留轻量元数据与视图</text>
<text x="868" y="483" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">原始事件先汇总核验；30 天是最早可删</text>
<text x="868" y="512" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">活动任务与未完成回执不得直接清理</text>
<text x="868" y="541" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">大缓存、临时副本、node_modules 不进 iCloud</text>
<text x="868" y="570" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">正式长期源码与锁文件留在课题或项目</text>
<text x="868" y="599" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">联网 MCP 只按需做只读连接探测</text>
<text x="868" y="628" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">宿主沙箱、工具审批继续生效</text>
<text x="868" y="657" font-size="12.5" font-weight="400" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">本机 Hook 不等于完整模型监督</text>
