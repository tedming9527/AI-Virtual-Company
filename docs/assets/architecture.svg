<title id="title">AI-Virtual-Company 现行架构：责任、目录契约与资产升级</title>
<desc id="desc">展示系统代码、大模型和人工的责任边界；中央、个人与运行时目录契约；资产发现、统计、提炼、复核、发布及本地公开视图隔离。</desc>
