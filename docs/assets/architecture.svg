<text x="40" y="45" font-size="28" font-weight="800" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">AI-Virtual-Company · 现行架构</text>
<text x="40" y="72" font-size="14" font-weight="400" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">中央目录 v1.4.3  |  一张图看清责任、目录与升级  |  实线表示流程关系，不代表每步都已自动化</text>
